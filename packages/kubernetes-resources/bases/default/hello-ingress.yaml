apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-app
  namespace: confighubplaceholder
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # The IngressClass of the controller that serves this Ingress. Left as a
  # placeholder because there is no safe default: the class depends on the
  # controller each cluster runs (the community ingress-nginx controller has
  # been retired). Set it per cluster, or consider the Gateway API instead.
  ingressClassName: confighubplaceholder
  tls:
    - hosts:
        - hello.example.com
      secretName: hello-app-tls
  rules:
    - host: hello.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-app
                port:
                  number: 80
