apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hello-app
  namespace: confighubplaceholder
spec:
  # The DNS name(s) the cert is issued for. Left as a placeholder so the
  # consumer (or a per-env PostClone trigger) substitutes the real host.
  dnsNames:
    - confighubplaceholder
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  # The Secret cert-manager produces. Left as a placeholder so ConfigHub
  # Links resolve it to a Secret Unit's slug when one is created; without a
  # Link, edit it to the desired Secret name.
  secretName: confighubplaceholder
