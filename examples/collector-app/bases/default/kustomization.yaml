apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- serviceaccount.yaml
- clusterrolebinding.yaml
- deployment.yaml
configMapGenerator:
- envs:
  - collector-app.env
  name: collector-app-env
  options:
    annotations:
      confighub.com/toolchain: AppConfig/Env
secretGenerator:
- envs:
  - collector-app-secret.env.secret
  name: collector-app-secret
generatorOptions:
  disableNameSuffixHash: true
