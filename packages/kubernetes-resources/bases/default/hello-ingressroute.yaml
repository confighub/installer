apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hello-app
  namespace: confighubplaceholder
  annotations:
    # external-dns publishes a DNS record pointing at this target. Left as a
    # placeholder so a per-env PostClone trigger substitutes the load-balancer
    # hostname.
    external-dns.alpha.kubernetes.io/target: confighubplaceholder
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`confighubplaceholder`)
      services:
        # Service this route forwards to. Placeholder so a ConfigHub Link
        # resolves it to a Service Unit in the same Space.
        - name: confighubplaceholder
          port: 80
  tls:
    # The Secret holding the TLS cert (typically produced by a cert-manager
    # Certificate). Placeholder so a ConfigHub Link resolves it.
    secretName: confighubplaceholder
