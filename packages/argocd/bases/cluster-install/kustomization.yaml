apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Equivalent to upstream manifests/cluster-install: namespace-install
# components + cluster-scoped RBAC + CRDs. Use this when ArgoCD will
# deploy applications into the cluster it itself runs in.

resources:
  - ../../upstream/base
  - ../../upstream/cluster-rbac
  - ../../upstream/crds

images:
  - name: quay.io/argoproj/argocd
    newName: quay.io/argoproj/argocd
    newTag: v3.4.2
